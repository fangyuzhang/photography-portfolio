<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芳羽 · 摄影作品集</title>
<style>
:root{
  --bg:#0f1012; --bg2:#16181b; --line:#26282c;
  --ink:#e9e7e2; --ink2:#9c988f; --ink3:#6b6760;
  --acc:#c0764f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.65;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* 头部 */
header{padding:64px 0 30px;border-bottom:1px solid var(--line)}
.kicker{font-size:12px;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin:0 0 14px}
h1{
  font-size:34px;font-weight:500;margin:0 0 12px;letter-spacing:.01em;
}
h1 span{color:var(--acc)}
.lede{font-size:14px;color:var(--ink2);margin:0;max-width:640px}
.spec{display:flex;flex-wrap:wrap;gap:26px;margin:26px 0 0;padding:0;list-style:none}
.spec li{font-size:12.5px;color:var(--ink2)}
.spec b{display:block;font-size:16px;color:var(--ink);font-weight:500;letter-spacing:.02em}

/* 筛选 */
.bar{
  position:sticky;top:0;z-index:20;background:rgba(15,16,18,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-top:0;padding:14px 0;
}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{
  appearance:none;background:transparent;color:var(--ink2);
  border:1px solid var(--line);border-radius:999px;
  padding:6px 15px;font-size:13px;cursor:pointer;transition:.18s;
  font-family:inherit;
}
.filters button:hover{color:var(--ink);border-color:#3a3d43}
.filters button.on{background:var(--ink);color:#111;border-color:var(--ink)}
.count{margin-left:auto;font-size:12px;color:var(--ink3);align-self:center}

/* 瀑布流 */
.grid{column-count:3;column-gap:18px;padding:28px 0 10px}
@media(max-width:900px){.grid{column-count:2}}
@media(max-width:560px){.grid{column-count:1}}
.card{
  break-inside:avoid;margin:0 0 18px;position:relative;cursor:zoom-in;
  background:var(--bg2);border-radius:3px;overflow:hidden;
}
.card img{width:100%;display:block;transition:transform .5s cubic-bezier(.2,.7,.3,1),filter .3s}
.card:hover img{transform:scale(1.025);filter:brightness(.82)}
.meta{
  position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.78));
  opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none;
}
.card:hover .meta{opacity:1;transform:none}
.meta h3{margin:0;font-size:15px;font-weight:500;letter-spacing:.01em}
.meta p{margin:2px 0 0;font-size:11.5px;color:#b9b4aa;font-variant-numeric:tabular-nums}

/* 灯箱 */
.lb{
  position:fixed;inset:0;z-index:100;background:rgba(8,9,10,.97);
  display:none;align-items:center;justify-content:center;
}
.lb.on{display:flex}
.lb figure{margin:0;max-width:94vw;max-height:88vh;text-align:center}
.lb img{max-width:94vw;max-height:80vh;object-fit:contain;display:block;margin:0 auto}
.lb figcaption{margin-top:16px;font-size:13.5px;color:var(--ink2)}
.lb figcaption b{color:var(--ink);font-weight:500;font-size:15px;margin-right:10px}
.lb .orig{color:var(--acc);text-decoration:none;margin-left:14px;font-size:12.5px}
.lb .orig:hover{text-decoration:underline}
.lb button{
  position:absolute;background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--ink);width:44px;height:44px;border-radius:50%;cursor:pointer;
  font-size:18px;line-height:1;display:grid;place-items:center;
}
.lb button:hover{background:rgba(255,255,255,.12)}
.lb .prev{left:24px;top:50%;transform:translateY(-50%)}
.lb .next{right:24px;top:50%;transform:translateY(-50%)}
.lb .close{right:24px;top:24px;transform:none}

footer{border-top:1px solid var(--line);margin-top:36px;padding:26px 0 60px;color:var(--ink3);font-size:12.5px}
footer a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="kicker">Fang Yu &nbsp;·&nbsp; Photography</p>
    <h1>芳羽 <span>·</span> 摄影作品集</h1>
    <p class="lede">35 张日常拍摄，题材以花卉、城市街景与古建细节为主。整组用同一台机身、两只镜头拍完，参数完整保留，可在每张下方查看。</p>
    <ul class="spec">
      <li><b>Nikon APS-C</b>2400 万像素</li>
      <li><b>50mm f/1.8</b>等效 75mm · 主力</li>
      <li><b>28–200mm</b>等效 42–300mm</li>
      <li><b>35 张</b>ISO 100 / M 档为主</li>
    </ul>
  </div>
</header>

<div class="bar">
  <div class="wrap" style="display:flex;align-items:center;gap:8px">
    <div class="filters" id="filters">
      <button class="on" data-cat="all">全部</button>
      <button data-cat="flower">花卉</button>
      <button data-cat="city">城市街头</button>
      <button data-cat="arch">古建细节</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap">
    芳羽 · 摄影作品集 &nbsp;|&nbsp; 仓库内 <code>web/</code> 为网页用压缩图（长边 1600px），根目录为原始文件<br>
    联系：zjh3085262115@163.com
  </div>
</footer>

<div class="lb" id="lb">
  <button class="prev" id="prev" aria-label="上一张">‹</button>
  <button class="next" id="next" aria-label="下一张">›</button>
  <button class="close" id="close" aria-label="关闭">✕</button>
  <figure>
    <img id="lbimg" alt="">
    <figcaption><b id="lbtitle"></b><span id="lbmeta"></span><a class="orig" id="lborig" href="#" target="_blank" rel="noopener">查看原图 ↗</a></figcaption>
  </figure>
</div>

<script>
/* [编号, 标题, 分类, 等效焦距, 光圈, 快门, 原始文件名] */
const D=[
[1,"蔷薇满架","flower","75mm","f/4.0","1/250s","[01] 50mm 等效75mm f4.0 1-250s.jpg"],
[2,"橙菊","flower","75mm","f/3.2","1/400s","[02] 50mm 等效75mm f3.2 1-400s.jpg"],
[3,"橙菊 · 宽幅","flower","75mm","f/3.2","1/400s","[03] 50mm 等效75mm f3.2 1-400s.jpg"],
[4,"白玫瑰","flower","75mm","f/4.0","1/800s","[04] 50mm 等效75mm f4.0 1-800s.jpg"],
[5,"树影光斑","city","75mm","f/2.0","1/1600s","[05] 50mm 等效75mm f2.0 1-1600s.jpg"],
[6,"草地上的灯","city","75mm","f/2.0","1/800s","[06] 50mm 等效75mm f2.0 1-800s.jpg"],
[7,"三朵月季","flower","75mm","f/2.5","1/500s","[07] 50mm 等效75mm f2.5 1-500s.jpg"],
[8,"一朵月季","flower","75mm","f/3.2","1/320s","[08] 50mm 等效75mm f3.2 1-320s.jpg"],
[9,"雨后蔷薇","flower","75mm","f/2.5","1/1000s","[09] 50mm 等效75mm f2.5 1-1000s.jpg"],
[10,"暗香","flower","75mm","f/2.5","1/1000s","[10] 50mm 等效75mm f2.5 1-1000s.jpg"],
[11,"叶间","flower","75mm","f/2.5","1/1250s","[11] 50mm 等效75mm f2.5 1-1250s.jpg"],
[12,"解脱","arch","98mm","f/4.8","1/1000s","[12] 65mm 等效98mm f4.8 1-1000s.jpg"],
[13,"春枝","flower","75mm","f/1.8","1/3200s","[13] 50mm 等效75mm f1.8 1-3200s.jpg"],
[14,"海棠满枝","flower","75mm","f/1.8","1/3200s","[14] 50mm 等效75mm f1.8 1-3200s.jpg"],
[15,"花光","flower","75mm","f/2.0","1/3200s","[15] 50mm 等效75mm f2.0 1-3200s.jpg"],
[16,"金色楼群","city","218mm","f/5.3","1/100s","[16] 145mm 等效218mm f5.3 1-100s.jpg"],
[17,"垂枝","flower","300mm","f/5.6","1/1000s","[17] 200mm 等效300mm f5.6 1-1000s.jpg"],
[18,"一枝春","flower","300mm","f/5.6","1/1250s","[18] 200mm 等效300mm f5.6 1-1250s.jpg"],
[19,"檐下花","flower","300mm","f/5.6","1/1250s","[19] 200mm 等效300mm f5.6 1-1250s.jpg"],
[20,"重瓣","flower","218mm","f/5.3","1/640s","[20] 145mm 等效218mm f5.3 1-640s.jpg"],
[21,"樱与天","flower","218mm","f/5.3","1/640s","[21] 145mm 等效218mm f5.3 1-640s.jpg"],
[22,"郁金香海","flower","158mm","f/5.3","1/20s","[22] 105mm 等效158mm f5.3 1-20s.jpg"],
[23,"巷口","city","75mm","f/5.0","1/800s","[23] 50mm 等效75mm f5.0 1-800s.jpg"],
[24,"标语与车","city","75mm","f/4.0","1/640s","[24] 50mm 等效75mm f4.0 1-640s.jpg"],
[25,"黄墙红蔷","flower","75mm","f/5.0","1/640s","[25] 50mm 等效75mm f5.0 1-640s.jpg"],
[26,"蔷薇丛","flower","75mm","f/4.0","1/250s","[26] 50mm 等效75mm f4.0 1-250s.jpg"],
[27,"逆光菊","flower","75mm","f/4.0","1/1000s","[27] 50mm 等效75mm f4.0 1-1000s.jpg"],
[28,"放风筝的黄昏","city","255mm","f/5.6","1/250s","[28] 170mm 等效255mm f5.6 1-250s.jpg"],
[29,"初绽","flower","300mm","f/5.6","1/640s","[29] 200mm 等效300mm f5.6 1-640s.jpg"],
[30,"落日天际线","city","112mm","f/4.8","1/1250s","[30] 75mm 等效112mm f4.8 1-1250s.jpg"],
[31,"花枝","flower","138mm","f/5.0","1/1250s","[31] 92mm 等效138mm f5.0 1-1250s.jpg"],
[32,"柔光海棠","flower","75mm","f/2.0","1/5000s","[32] 50mm 等效75mm f2.0 1-5000s.jpg"],
[33,"珊瑚月季","flower","75mm","f/2.5","1/1000s","[33] 50mm 等效75mm f2.5 1-1000s.jpg"],
[34,"宽银幕 · 菊","flower","—","—","—","[34] 参数缺失.jpg"],
[35,"采蜜","flower","75mm","f/4.0","1/200s","[35] 50mm 等效75mm f4.0 1-200s.jpg"]
];

const grid=document.getElementById("grid");
const countEl=document.getElementById("count");
let shown=[];

function num(n){return String(n).padStart(2,"0")}

function render(cat){
  grid.innerHTML="";
  shown = cat==="all" ? D.slice() : D.filter(d=>d[2]===cat);
  countEl.textContent = shown.length+" / 35 张";
  shown.forEach((d,idx)=>{
    const card=document.createElement("figure");
    card.className="card";
    card.innerHTML =
      '<img loading="lazy" src="web/'+num(d[0])+'.jpg" alt="'+d[1]+'">'+
      '<div class="meta"><h3>'+num(d[0])+' &nbsp;'+d[1]+'</h3>'+
      '<p>'+d[3]+' · '+d[4]+' · '+d[5]+' · ISO 100</p></div>';
    card.addEventListener("click",()=>openLb(idx));
    grid.appendChild(card);
  });
}

/* 灯箱 */
const lb=document.getElementById("lb"), lbimg=document.getElementById("lbimg");
let cur=0;
function openLb(i){
  cur=i; const d=shown[i];
  lbimg.src="web/"+num(d[0])+".jpg";
  document.getElementById("lbtitle").textContent=num(d[0])+" "+d[1];
  document.getElementById("lbmeta").textContent=d[3]+" · "+d[4]+" · "+d[5]+" · ISO 100";
  document.getElementById("lborig").href=encodeURI(d[6]);
  lb.classList.add("on");
}
function closeLb(){lb.classList.remove("on"); lbimg.src=""}
function step(n){cur=(cur+n+shown.length)%shown.length; openLb(cur)}
document.getElementById("close").onclick=closeLb;
document.getElementById("prev").onclick=e=>{e.stopPropagation();step(-1)};
document.getElementById("next").onclick=e=>{e.stopPropagation();step(1)};
lb.addEventListener("click",e=>{if(e.target===lb)closeLb()});
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("on"))return;
  if(e.key==="Escape")closeLb();
  if(e.key==="ArrowLeft")step(-1);
  if(e.key==="ArrowRight")step(1);
});

document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  render(b.dataset.cat);
});

render("all");
</script>
</body>
</html>
